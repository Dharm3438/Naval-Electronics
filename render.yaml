# Render Blueprint — https://render.com/docs/blueprint-spec
#
# The site is a Next.js static export, so it needs no server at runtime:
# `npm run build` writes plain HTML/CSS/JS into out/ and Render serves it
# from its CDN with a free TLS certificate.
services:
  - type: web
    name: naval-electronics
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    # Web3Forms access key for the consultation form (see README → "Getting
    # enquiries by email"). Render asks for the value when the Blueprint is
    # created; for an existing service add it under Environment, then redeploy.
    envVars:
      - key: NEXT_PUBLIC_WEB3FORMS_KEY
        sync: false
    # Only rebuild when something that affects the site changes.
    buildFilter:
      paths:
        - src/**
        - public/**
        - package.json
        - package-lock.json
        - next.config.ts
        - tsconfig.json
        - postcss.config.*
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Next.js fingerprints these filenames, so they can be cached forever.
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
