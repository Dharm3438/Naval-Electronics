# Render Blueprint — https://render.com/docs/blueprint-spec
#
# The site is a Next.js static export, so it needs no server at runtime:
# `npm run build` writes plain HTML/CSS/JS into out/ and Render serves it
# from its CDN with a free TLS certificate.
services:
  - type: web
    name: naval-electronics
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    # Only rebuild when something that affects the site changes.
    buildFilter:
      paths:
        - src/**
        - public/**
        - package.json
        - package-lock.json
        - next.config.ts
        - tsconfig.json
        - postcss.config.*
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Next.js fingerprints these filenames, so they can be cached forever.
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Hero images. File names carry a version (hero-v3-…), so they can be
      # cached for a year; bump the version when replacing one.
      - path: /hero/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Brand and customer photos keep their file names when replaced, so let
      # browsers reuse them for a week instead of re-checking on every visit.
      - path: /brands/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /customers/*
        name: Cache-Control
        value: public, max-age=604800
